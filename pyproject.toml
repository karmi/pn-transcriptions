[project]
name = "pn-transcriptions"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "assemblyai>=0.46.0",
    "humanize>=4.10.0",
    "pytest>=9.0.1",
    "python-dotenv>=1.0.1",
    "rich>=13.9.2",
    "typer>=0.12.5",
    "unidecode>=1.3.8",
    "requests>=2.32.3",
    "nbformat>=5.10.4",
    "nbconvert>=7.16.6",
    "rapidfuzz>=3.14.3",
    "google-genai>=1.58.0",
    "pydantic>=2.12.4",
    "boto3>=1.42.39",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = ["scripts"]
